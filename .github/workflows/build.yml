name: Build iOS26Anim

on:
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync perl zip git unzip curl

      - name: Install Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Check Theos
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS"
          ls "$THEOS/sdks"

      - name: Build .deb
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show package
        run: |
          find packages -type f -name "*.deb" -print

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: iOS26Anim-deb
          path: packages/*.deb
          if-no-files-found: error
